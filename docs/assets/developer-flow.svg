      0%, 100% { opacity: 0.25; transform: scale(1); }
      50%      { opacity: 0.65; transform: scale(1.035); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
      .pulse { animation: none; opacity: 0.35; }
    }
  </style>
