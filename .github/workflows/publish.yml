name: Publish

# Builds wheel + sdist on every v*.*.* tag push, attaches both as release
# assets, and (optionally) publishes to PyPI via Trusted Publishing.
#
# PyPI publishing is gated by the `pypi` GitHub Actions environment. The
# environment is intentionally NOT created in this repo by default; the
# `publish-pypi` job is skipped until a repo admin:
#   1. Claims the `fabric-ai-meta` name on PyPI
#   2. Configures Trusted Publishing on the PyPI project page, pointing at
#      this workflow file (publish.yml) and the `pypi` environment
#   3. Creates a GitHub environment named `pypi` in repo Settings
# Once those three steps are complete, every `v*` tag push will both
# attach assets to the release AND publish to PyPI in a single workflow run.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Ensure GitHub release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --notes "Automated release for ${GITHUB_REF_NAME}. See CHANGELOG.md for details."
          fi

      - name: Attach wheel and sdist to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz \
            --clobber

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # Gated behind the `PYPI_PUBLISH_ENABLED` repository variable. The job is
    # skipped (not failed) until an admin enables it. To turn on:
    #   1. Claim the `fabric-ai-meta` name on PyPI and configure Trusted
    #      Publishing pointing at this workflow file with environment `pypi`
    #      (Repo: psistla/fabric-ai-meta, Workflow: publish.yml, Env: pypi)
    #   2. Create a GitHub environment named `pypi` in repo Settings
    #   3. Set repo variable `PYPI_PUBLISH_ENABLED` to the string `true` under
    #      repo Settings -> Secrets and variables -> Actions -> Variables
    # Once those three steps are complete, every v* tag push publishes to PyPI.
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/fabric-ai-meta/
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No `password` / `username` set: uses OIDC trusted publishing.
          skip-existing: true
          # Explicitly generate and upload PEP 740 sigstore attestations for
          # the wheel and sdist. This is the default in pypa/gh-action-pypi-publish
          # since v1.10, but pin it here so a future action default change
          # cannot silently drop provenance signatures from our releases.
          attestations: true
