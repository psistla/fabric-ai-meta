[project]
name = "fabric-ai-meta"
version = "1.7.0"
description = "Turn Microsoft Fabric and Power BI semantic models into AI-ready metadata from your laptop. Reads local .pbip/TMDL folders with no tenant or sign-in. Exports to LangChain, OpenAI, Semantic Kernel, and AutoGen, with cross-model governance, an MCP server, and a graph-necessity advisor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prasanth Sistla", email = "psistlaw@gmail.com" },
]
keywords = [
    "microsoft-fabric",
    "power-bi",
    "semantic-model",
    "tabular-model",
    "dax",
    "ai-ready",
    "langchain",
    "openai",
    "semantic-kernel",
    "autogen",
    "prep-for-ai",
    "mcp",
    "pbip",
    "tmdl",
    "ontology",
    "knowledge-graph",
    "data-governance",
    "model-context-protocol",
    "llm",
    "litellm",
    "governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.1,<9.0",                 # CLI framework; 9.0 will remove deprecated APIs
    "anthropic>=0.40",                 # Default LLM provider SDK (replaceable via [llm] extra; see config.llm.provider)
    "azure-identity>=1.15",            # Entra ID authentication
    "semantic-link-sempy>=0.8",        # Fabric Semantic Link
    "pydantic>=2.0",                   # Data validation
    "rich>=13.0",                      # CLI output formatting (includes progress bars)
    "networkx>=3.0",                   # DAX dependency graph analysis
    "tomli>=2.0; python_version<'3.11'",  # TOML parsing backport for Python 3.10
]

[project.optional-dependencies]
xmla = [
    "pyadomd>=0.1",                    # XMLA connectivity: Windows-only (requires ADOMD.NET)
                                       # Not available on Linux/macOS without additional setup
]
mcp = [
    "mcp[cli]>=1.0,<2.0",              # MCP server; 2.0 will rework FastMCP, transport, auth
]
llm = [
    "litellm>=1.50",                   # Multi-provider LLM router (100+ providers)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.20",
    "litellm>=1.50",                   # Required for LiteLLMBackend tests
]

[project.scripts]
fabric-ai-meta = "fabric_ai_meta.cli:main"

[project.urls]
Homepage = "https://github.com/psistla/fabric-ai-meta"
Repository = "https://github.com/psistla/fabric-ai-meta"
Issues = "https://github.com/psistla/fabric-ai-meta/issues"
Changelog = "https://github.com/psistla/fabric-ai-meta/blob/master/CHANGELOG.md"
Documentation = "https://github.com/psistla/fabric-ai-meta/blob/master/docs/user-guide.md"
Releases = "https://github.com/psistla/fabric-ai-meta/releases"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fabric_ai_meta = ["py.typed", "fixtures/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
